#Mikes KB2ML sBitx DE hardware settings
#running under minibitx control
#calculated to produce ~5 watts out on all bands

bfo_freq=40035000
ssb_val=1.0

[tcxo]
cal=24999960

#80 meters
# scale predicted via sqrt(5W / 3.5W measured @ 0.00075) from the
# 2026-09 wattmeter session - verify on the bench, not yet re-measured
# at this value. See docs/dsp_design_notes/tx_power_calibration.md.
[tx_band]
f_start=3500000
f_stop=4000000
scale=0.000978

#60 meters
# predicted via sqrt(5W / 4.3W measured @ 0.00095) - not yet re-measured
[tx_band]
f_start=5250000
f_stop=5450000
scale=0.00109

